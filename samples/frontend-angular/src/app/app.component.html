<mat-sidenav-container class="app-shell" autosize>
  <mat-sidenav #sidenav mode="side" [opened]="sidenavOpened" class="p-2">
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active">首页</a>
      <a mat-list-item routerLink="/protected" routerLinkActive="active">受保护页面</a>
      <a mat-list-item routerLink="/authorizations" routerLinkActive="active" *ngIf="isAuthenticated">授权管理</a>
      <a mat-list-item routerLink="/unauthorized" routerLinkActive="active">未授权页面</a>
    </mat-nav-list>
    <div class="mt-3" *ngIf="isAuthenticated">
      <mat-chip-set>
        <mat-chip color="primary" selected>{{ userData?.name || userData?.email || userData?.preferred_username || '用户'
          }}</mat-chip>
      </mat-chip-set>
    </div>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="gap-2">
      <span>🔐 IAM示例 - Angular应用</span>
      <span class="flex-grow-1"></span>
      <button *ngIf="!isAuthenticated" mat-raised-button color="accent" (click)="login()" [disabled]="!isInitialized">{{
        isInitialized ? '登录' : '初始化中...' }}</button>
      <button *ngIf="isAuthenticated" mat-raised-button color="warn" (click)="logout()">登出</button>
    </mat-toolbar>
    <div class="p-3">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
