<div class="login-container">
  <canvas id="starfield" class="login-canvas"></canvas>
  <div class="login-orb login-orb--primary"></div>
  <div class="login-orb login-orb--secondary"></div>

  <div class="login-shell">
    <mat-card class="login-card">
      <mat-card-content>
        <div class="login-brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <p class="login-kicker">{{ i18nKeys.login.login | translate }}</p>
          <h1 class="login-headline">{{ i18nKeys.login.unifiedDescription | translate }}</h1>
        </div>

        @if (errorMessage) {
          <div class="error-message" role="alert">{{ errorMessage }}</div>
        }

        <div class="login-actions">
          <button mat-flat-button type="button" (click)="startLogin()" [disabled]="isLoading">
            {{ i18nKeys.login.continue | translate }}
          </button>

          <button mat-button type="button" (click)="goToForgotPassword()">
            {{ i18nKeys.forgotPassword.title | translate }}
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
