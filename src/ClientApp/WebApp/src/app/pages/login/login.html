<div class="login-container">
  <canvas id="starfield"
    style="position:absolute;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;"></canvas>
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{i18nKeys.login.login | translate}}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <div class="login-form login-copy">
        <p>{{ 'login.unifiedDescription' | translate }}</p>
        <p class="muted">{{ 'login.unifiedHint' | translate }}</p>

        <div class="login-btn-row login-btn-stack">
          <button mat-flat-button type="button" (click)="startLogin()" [disabled]="isLoading">
            {{ 'login.continue' | translate }}
          </button>
          <p class="muted">{{ 'login.externalHint' | translate }}</p>
          <button mat-stroked-button type="button" (click)="startExternalLogin('google')" [disabled]="isLoading">
            {{ 'login.continueWithGoogle' | translate }}
          </button>
          <button mat-stroked-button type="button" (click)="startExternalLogin('microsoft')" [disabled]="isLoading">
            {{ 'login.continueWithMicrosoft' | translate }}
          </button>
          <button mat-stroked-button type="button" (click)="goToRegister()">
            {{ 'register.title' | translate }}
          </button>
          <button mat-button type="button" (click)="goToForgotPassword()">
            {{ 'forgotPassword.title' | translate }}
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
