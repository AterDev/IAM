<div class="d-flex flex-column">
  <div class="page-toolbar">
    <div class="page-toolbar__filters">
      <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
        <mat-label>{{ i18n.common.search | translate }}</mat-label>
        <input matInput [(ngModel)]="searchText" (keyup.enter)="onSearch()" placeholder="Name or Display Name">
        <button mat-icon-button matSuffix (click)="onSearch()">
          <mat-icon>search</mat-icon>
        </button>
      </mat-form-field>

      <button mat-icon-button (click)="clearFilters()" type="button" class="filter-clear-button"
        [matTooltip]="i18n.common.clearFilters | translate" [attr.aria-label]="i18n.common.clearFilters | translate">
        <mat-icon>filter_alt_off</mat-icon>
      </button>
    </div>

    <div class="page-toolbar__actions">
      <button matButton="filled" (click)="openAddDialog()" type="button">
        <mat-icon>add</mat-icon>
        {{ i18n.common.add | translate }}
      </button>
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="dataSource()" class="resource-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>{{ i18n.resource.name | translate }}</th>
        <td mat-cell *matCellDef="let resource"><strong>{{ resource.name }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="displayName">
        <th mat-header-cell *matHeaderCellDef>{{ i18n.resource.displayName | translate }}</th>
        <td mat-cell *matCellDef="let resource">{{ resource.displayName }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>{{ i18n.resource.description | translate }}</th>
        <td mat-cell *matCellDef="let resource">{{ resource.description || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>{{ i18n.common.actions | translate }}</th>
        <td mat-cell *matCellDef="let resource">
          <button mat-icon-button [matMenuTriggerFor]="menu">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="viewDetail(resource.id)">
              <mat-icon>visibility</mat-icon>
              <span>{{ i18n.common.view | translate }}</span>
            </button>
            <button mat-menu-item (click)="deleteResource(resource.id)" class="error">
              <mat-icon>delete</mat-icon>
              <span>{{ i18n.common.delete | translate }}</span>
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div class="loading-shade" *ngIf="isLoading()">
      <mat-spinner></mat-spinner>
    </div>
  </div>

  <mat-paginator [length]="total()" [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="[5, 10, 20, 50]"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
