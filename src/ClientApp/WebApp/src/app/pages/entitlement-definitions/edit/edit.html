<h2 mat-dialog-title>{{ 'common.edit' | translate }}</h2><mat-dialog-content><form [formGroup]="form" class="d-flex flex-column"><mat-form-field><mat-label>{{ 'entitlement.code' | translate }}</mat-label><input matInput [formControl]="form.controls.entitlementCode"></mat-form-field><mat-form-field><mat-label>{{ 'entitlement.displayName' | translate }}</mat-label><input matInput [formControl]="form.controls.displayName"></mat-form-field><mat-form-field><mat-label>{{ 'entitlement.unit' | translate }}</mat-label><input matInput [formControl]="form.controls.unit"></mat-form-field><mat-form-field><mat-label>{{ 'entitlement.description' | translate }}</mat-label><textarea matInput [formControl]="form.controls.description"></textarea></mat-form-field><mat-form-field><mat-label>{{ 'entitlement.type' | translate }}</mat-label><mat-select [formControl]="form.controls.entitlementType"><mat-option [value]="type.ProxyUsage">{{ 'entitlement.proxyUsage' | translate }}</mat-option></mat-select></mat-form-field></form></mat-dialog-content><mat-dialog-actions align="end"><button matButton mat-dialog-close>{{ 'common.cancel' | translate }}</button><button matButton="filled" (click)="save()">{{ 'common.save' | translate }}</button></mat-dialog-actions>
