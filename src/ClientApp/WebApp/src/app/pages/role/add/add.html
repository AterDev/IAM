<h2 mat-dialog-title>{{ i18n.role.addRole | translate }}</h2>

<mat-dialog-content>
  <form [formGroup]="roleForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ i18n.role.name | translate }}</mat-label>
      <input matInput [formControl]="name" [placeholder]="i18n.role.namePlaceholder | translate">
      @if (name.hasError('required')) {
        <mat-error>{{ i18n.validation.required | translate }}</mat-error>
      }
      @if (name.hasError('minlength')) {
        <mat-error>{{ i18n.validation.minlength | translate: {requiredLength: 2} }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>{{ i18n.role.description | translate }}</mat-label>
      <textarea matInput [formControl]="description" rows="3" [placeholder]="i18n.role.descriptionPlaceholder | translate"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ i18n.common.cancel | translate }}</button>
  <button mat-raised-button  (click)="onSubmit()" [disabled]="!roleForm.valid || isSubmitting">
    {{ isSubmitting ? (i18n.common.saving | translate) : (i18n.common.save | translate) }}
  </button>
</mat-dialog-actions>
