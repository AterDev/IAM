<h2 mat-dialog-title>{{ i18n.common.edit | translate }}</h2>
<mat-dialog-content>
  <div class="d-flex flex-column">
    <mat-form-field>
      <mat-label>{{ i18n.entitlement.definitionTitle | translate }}</mat-label>
      <input matInput [value]="data.displayName + ' (' + data.entitlementCode + ')'" readonly>
    </mat-form-field>
    <mat-form-field>
      <mat-label>{{ i18n.entitlement.valueLimit | translate }}</mat-label>
      <input matInput type="number" [formControl]="form.controls.valueLimit">
    </mat-form-field>
    <mat-form-field>
      <mat-label>{{ i18n.entitlement.startDate | translate }}</mat-label>
      <input matInput type="datetime-local" [formControl]="form.controls.startDate">
    </mat-form-field>
    <mat-form-field>
      <mat-label>{{ i18n.entitlement.expirationDate | translate }}</mat-label>
      <input matInput type="datetime-local" [formControl]="form.controls.expirationDate">
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>{{ i18n.common.cancel | translate }}</button>
  <button matButton="filled" (click)="save()">{{ i18n.common.save | translate }}</button>
</mat-dialog-actions>
